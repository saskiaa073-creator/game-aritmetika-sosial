<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Pasar Pintar – Game Aritmetika Sosial</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.94.0/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Menjalankan aplikasi Streamlit langsung di browser (tanpa server)
      // memakai stlite, sehingga bisa dibuka lewat GitHub Pages.
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.94.0/build/stlite.js";
      mount(
        {
          requirements: ["pandas"],
          entrypoint: "app.py",
          files: {
            // Daftarkan SEMUA file .py yang dipakai aplikasi di sini.
            "app.py": { url: "./app.py" },
            "tests/soal_generator.py": { url: "./tests/soal_generator.py" },
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
